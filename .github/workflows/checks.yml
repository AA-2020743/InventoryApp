name: checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    # The checks under scripts/checks: each one exists because a specific
    # mistake reached a build or a phone. They are pure Python and take
    # seconds, so they run on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ./scripts/checks/run_all.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  android:
    # The one that would have caught every build break so far. It needs the
    # Android SDK, which the toolchain below installs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Compile
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
