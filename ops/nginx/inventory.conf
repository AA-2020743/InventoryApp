# nginx site for the inventory API.
#
# Install as /etc/nginx/sites-available/inventory, symlink it into
# sites-enabled, and drop the stock default site - the default server block
# answers every name nginx doesn't recognise, so leaving it in place is how
# a correct request ends up as a 404 from nginx rather than reaching node.
#
#   sudo cp ops/nginx/inventory.conf /etc/nginx/sites-available/inventory
#   sudo ln -sf /etc/nginx/sites-available/inventory /etc/nginx/sites-enabled/inventory
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP-only on purpose. Run certbot once the name resolves to
# this machine and it rewrites this block in place - adding the TLS server
# block, the certificate paths and the 80 -> 443 redirect:
#
#   sudo certbot --nginx -d api.alkheer-zadah.online \
#                        -d alkheer-zadah.online -d www.alkheer-zadah.online
#
# Pass only the names that already resolve to this machine. Let's Encrypt
# validates each one by fetching from it, so a name still pointing at the
# registrar's parking page fails the whole run and counts against the rate
# limit.
#
# Writing the TLS block by hand first is the common way to wedge this:
# nginx refuses to start when ssl_certificate points at a file certbot has
# not created yet, which takes the site down instead of bringing it up.

server {
    listen 80;
    listen [::]:80;

    server_name api.alkheer-zadah.online alkheer-zadah.online www.alkheer-zadah.online;

    # Product photos cap at 8 MB server-side (multer, uploads.routes.ts);
    # nginx's own default is 1 MB, which would turn a large photo into a 413
    # the app can only report as a failed save.
    client_max_body_size 12m;

    # Everything goes to node: the app calls /api/... , uploaded images are
    # served from /uploads/... , and /health is at the root.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A restore or a backup pull can hold the connection open well past
        # the 60s default while Postgres works.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
